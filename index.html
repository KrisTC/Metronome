<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description" content="A simple free metronome web app with accurate timing, offline support, and no ads or logins.">
    <meta name="theme-color" content="#f7f2ea">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Metronome">
    <title>Metronome</title>
    <link rel="canonical" href="https://kristc.github.io/Metronome/">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Metronome">
    <meta property="og:title" content="Metronome">
    <meta property="og:description" content="A simple free metronome web app with accurate timing, offline support, and no ads or logins.">
    <meta property="og:url" content="https://kristc.github.io/Metronome/">
    <meta property="og:image" content="https://kristc.github.io/Metronome/icons/icon-512.png">
    <meta property="og:image:width" content="512">
    <meta property="og:image:height" content="512">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Metronome">
    <meta name="twitter:description" content="A simple free metronome web app with accurate timing, offline support, and no ads or logins.">
    <meta name="twitter:image" content="https://kristc.github.io/Metronome/icons/icon-512.png">
    <link rel="stylesheet" href="styles.css">
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "@id": "https://kristc.github.io/Metronome/#app",
        "name": "Metronome",
        "url": "https://kristc.github.io/Metronome/",
        "applicationCategory": "MusicApplication",
        "operatingSystem": "Any",
        "browserRequirements": "Requires a modern browser with Web Audio support.",
        "description": "A simple free metronome web app with accurate timing, offline support, and no ads or logins.",
        "image": "https://kristc.github.io/Metronome/icons/icon-512.png",
        "isAccessibleForFree": true,
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        },
        "featureList": [
          "30-240 BPM tempo range",
          "Beat groupings for 1, 2, 3, 4, and 6 beats",
          "Optional first-beat accent",
          "Optional one-bar count-in",
          "Offline support after first load",
          "iPhone home screen installation"
        ]
      }
    </script>
  </head>
  <body>
    <main class="app" aria-labelledby="app-title">
      <section class="tempo-panel" aria-labelledby="tempo-title">
        <div class="tempo-heading">
          <h1 id="app-title">Metronome</h1>
          <h2 id="tempo-title">Tempo</h2>
        </div>
        <label class="bpm-control">
          <span class="sr-only">Beats per minute</span>
          <input id="bpm-input" type="number" inputmode="numeric" min="30" max="240" step="1" value="84" aria-describedby="bpm-range">
          <span>BPM</span>
        </label>
        <p id="bpm-range" class="hint">30-240</p>

        <div class="tempo-buttons" aria-label="Tempo adjustments">
          <button class="step-button" type="button" data-step="-5">-5</button>
          <button class="step-button" type="button" data-step="-1">-1</button>
          <button class="step-button" type="button" data-step="1">+1</button>
          <button class="step-button" type="button" data-step="5">+5</button>
        </div>
      </section>

      <section class="pulse-panel" aria-label="Current beat">
        <div id="pulse-ring" class="pulse-ring" aria-hidden="true">
          <span id="beat-number">1</span>
        </div>
        <div id="beat-dots" class="beat-dots" aria-hidden="true"></div>
      </section>

      <button id="play-button" class="play-button" type="button" aria-pressed="false">
        <span id="play-label">Start</span>
      </button>

      <section class="settings-grid" aria-label="Metronome settings">
        <fieldset class="setting-card">
          <legend>Beats</legend>
          <div class="segmented" role="radiogroup" aria-label="Beats per bar">
            <label><input type="radio" name="beats" value="1"> <span>1</span></label>
            <label><input type="radio" name="beats" value="2"> <span>2</span></label>
            <label><input type="radio" name="beats" value="3"> <span>3</span></label>
            <label><input type="radio" name="beats" value="4" checked> <span>4</span></label>
            <label><input type="radio" name="beats" value="6"> <span>6</span></label>
          </div>
        </fieldset>

        <fieldset class="setting-card">
          <legend>Sound</legend>
          <div class="segmented sound-choice" role="radiogroup" aria-label="Sound">
            <label><input type="radio" name="sound" value="metronome" checked> <span>Classic</span></label>
            <label><input type="radio" name="sound" value="drumstick"> <span>Stick</span></label>
          </div>
        </fieldset>

        <div class="toggle-row">
          <label class="toggle">
            <input id="accent-toggle" type="checkbox" checked>
            <span>Accent first beat</span>
          </label>
          <label class="toggle">
            <input id="count-in-toggle" type="checkbox">
            <span>Count in one bar</span>
          </label>
          <label class="toggle">
            <input id="wake-lock-toggle" type="checkbox" checked>
            <span>Keep screen awake</span>
          </label>
        </div>
      </section>

      <section class="credits-panel" aria-labelledby="credits-title">
        <h2 id="credits-title">Audio</h2>
        <p>Clicks generated locally with Web Audio.</p>
      </section>
    </main>

    <div id="update-toast" class="update-toast" hidden>
      <span>Update ready</span>
      <button id="update-button" type="button">Refresh</button>
    </div>
    <span id="version-label" class="version-label" aria-label="App version"></span>

    <script src="app.js" defer></script>
  </body>
</html>
